name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    name: rust build / test / lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is ARM64, which covers the second architecture the numeric layer
        # must stay bit-identical on.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # The oracle corpus (corpus/client/*.jsonl.gz) is committed as plain files, not LFS.
          lfs: false
      - name: Show toolchain (auto-installed from rust-toolchain.toml)
        run: rustup show
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --exclude ms-py --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude ms-py
      - name: Corpus is plain gzip, not LFS pointers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f .gitattributes ] && grep -q 'filter=lfs' .gitattributes; then
            echo "::error::the corpus must not use LFS (docs/corpus.md)"
            exit 1
          fi
          n=0
          for f in corpus/client/*.jsonl.gz; do
            gzip -t "$f" || { echo "::error::$f is not a valid gzip stream"; exit 1; }
            n=$((n + 1))
          done
          echo "OK: $n corpus scenarios are valid gzip"
      - name: Corpus replay and golden-hash lock (docs/contract.md section 5)
        # Replays every scenario in corpus/client through ms_kernel::player::tick and checks the
        # rolling state hashes against corpus/golden-hashes.json. Already part of `cargo test`;
        # run alone so a broken lock is named in the log.
        run: cargo test -p ms-corpus --test golden -- --nocapture
      - name: Oracle conformance report (informational)
        run: cargo xtask oracle

  python:
    name: python wheel / binding tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Show toolchain
        run: rustup show
      - name: Install maturin and runtime deps
        run: python -m pip install maturin numpy "gymnasium>=0.29"
      - name: Lint bindings (deny warnings)
        run: cargo clippy -p ms-py --all-targets -- -D warnings
      - name: Build wheel
        run: maturin build -m crates/ms-py/Cargo.toml --release --out dist
      - name: Install wheel
        run: python -m pip install --find-links dist minesim
      - name: Binding tests
        run: python crates/ms-py/tests/test_minesim.py

  determinism-lint:
    name: determinism flag lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject determinism-breaking codegen/FP flags
        shell: bash
        run: |
          # See docs/contract.md §4: target-cpu=native, fast-math, and FMA contraction
          # all break cross-machine bit-exactness. Scan build config / source, not docs.
          if grep -RInE '(-C ?target-cpu=native|-?ffast-math|fp-contract=fast)' \
               --include='*.toml' --include='*.rs' .; then
            echo "::error::Forbidden determinism-breaking flag found (see docs/contract.md §4)"
            exit 1
          fi
          echo "OK: no forbidden flags"
