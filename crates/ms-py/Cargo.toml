[package]
name = "ms-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# Built by maturin into the `minesim._core` extension module; the pure-Python `minesim`
# package (python/minesim) wraps it with the Gymnasium env and pluggable components.
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
ms-arena = { workspace = true }
ms-kernel = { workspace = true }
ms-numerics = { workspace = true }
ms-world = { workspace = true }
